name: Report a community post
description: Flag a post on CyberView's community feed that is false, harmful or breaks the rules.
title: "Report community post"
labels: ["chat-report"]
body:
  - type: input
    id: post
    attributes:
      label: Post number
      description: The number shown on the post (for example 123).
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: What is wrong with it
    validations:
      required: true
