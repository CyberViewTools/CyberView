name: AI jobs

# The Claude research and maintenance jobs, run by Claude Code's GitHub Action on a schedule.
# Each run: check out main, build the prompt from docs/jobs.md (shared preamble + the job's section),
# let Claude do the job and commit to main, then the Pages workflow redeploys the site.
# Signs in to Claude with the first of these that is set up (without any, every run skips in seconds):
#   1. Workload identity federation (recommended, no stored secret): the IDs in .github/claude-federation.json
#      (or repository variables of the same names, which win). Scope the rule to repo:xanderhutch@83180485/CyberView@1462335687:ref:refs/heads/main.
#   2. Repository secret ANTHROPIC_API_KEY (Claude Console, pay as you go).
#   3. Repository secret CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`; uses a Claude subscription).
# Schedule and models are listed in docs/jobs.md and routines.json; change them together.
on:
  # No schedule: the AI jobs run as Claude Code scheduled tasks in the "CyberView ops" session (see docs/jobs.md),
  # on the owner's Claude plan. This workflow stays as a manual fallback (needs Console credit for identity federation).
  workflow_dispatch:
    inputs:
      job:
        description: "Job to run"
        required: true
        type: choice
        options: [sweep, verify, report-review, analysis, deep-sweep, brief, watchdog, security-review]
      debug:
        description: "Show Claude's full output in the log (for diagnosing a failing run; the log is public)"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  id-token: write

concurrency:
  group: data-writes
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
      HAS_OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - name: Pick the job and model
        id: pick
        run: |
          case "${{ github.event.schedule }}" in
            "10 */4 * * *")  job=sweep ;;
            "19 3,15 * * *") job=verify ;;
            "17 13 * * *")   job=report-review ;;
            "50 12 * * *")   job=analysis ;;
            "17 9 * * 1,4")  job=deep-sweep ;;
            "40 11 * * *")   job=brief ;;
            "30 14 * * *")   job=watchdog ;;
            "5 8 * * 1")     job=security-review ;;
            *)               job="${{ inputs.job }}" ;;
          esac
          case "$job" in
            analysis|deep-sweep|security-review) model=claude-opus-5-5; turns=120 ;;
            watchdog)                            model=claude-haiku-5-5; turns=60 ;;
            *)                                   model=claude-sonnet-5-5; turns=100 ;;
          esac
          echo "job=$job" >> "$GITHUB_OUTPUT"; echo "model=$model" >> "$GITHUB_OUTPUT"; echo "turns=$turns" >> "$GITHUB_OUTPUT"
          echo "Job: $job, model: $model, " >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 50

      - name: Choose the Claude sign-in
        id: auth
        env:
          V_RULE: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          V_ORG: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          V_SVAC: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          V_WS: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
        run: |
          # federation IDs: repository variables win, else .github/claude-federation.json (IDs, not secrets)
          f=.github/claude-federation.json
          get() { node -e 'try{const v=JSON.parse(require("fs").readFileSync(process.argv[1]))[process.argv[2]]||"";if(/^[A-Za-z0-9_-]{0,80}$/.test(v))console.log(v)}catch{}' "$f" "$1"; }
          rule="${V_RULE:-$(get ANTHROPIC_FEDERATION_RULE_ID)}"; org="${V_ORG:-$(get ANTHROPIC_ORGANIZATION_ID)}"
          svac="${V_SVAC:-$(get ANTHROPIC_SERVICE_ACCOUNT_ID)}"; ws="${V_WS:-$(get ANTHROPIC_WORKSPACE_ID)}"
          if [ -n "$rule" ] && [ -n "$org" ]; then mode=wif
          elif [ "$HAS_KEY" = "true" ]; then mode=apikey
          elif [ "$HAS_OAUTH" = "true" ]; then mode=oauth
          else mode=none; fi
          { echo "mode=$mode"; echo "rule=$rule"; echo "org=$org"; echo "svac=$svac"; echo "ws=$ws"; } >> "$GITHUB_OUTPUT"
          echo "AUTH=$mode" >> "$GITHUB_ENV"; echo "HAS_TOKEN=$([ $mode = none ] && echo false || echo true)" >> "$GITHUB_ENV"
          echo "Sign-in: $mode" >> "$GITHUB_STEP_SUMMARY"

      - name: Show the GitHub identity token's claims (debug runs only; never the token itself)
        if: inputs.debug == true && env.AUTH == 'wif'
        run: |
          t=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.anthropic.com" | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>console.log(JSON.parse(d).value))')
          echo "$t" | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{const p=JSON.parse(Buffer.from(d.trim().split(".")[1],"base64url"));const k=["iss","aud","sub","repository","repository_owner","ref","event_name","job_workflow_ref","environment"];const o={};k.forEach(x=>{if(p[x]!==undefined)o[x]=p[x]});console.log(JSON.stringify(o,null,1))})' | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Skip when no Claude sign-in is set up
        if: env.HAS_TOKEN != 'true'
        run: echo "No Claude sign-in is set up (federation IDs in .github/claude-federation.json or repository variables, ANTHROPIC_API_KEY, or CLAUDE_CODE_OAUTH_TOKEN); skipping ${{ steps.pick.outputs.job }}." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@v4
        if: env.HAS_TOKEN == 'true'
        with:
          node-version: "22"

      - name: Prepare
        id: prompt
        if: env.HAS_TOKEN == 'true'
        run: |
          git config user.name "cyberview-${{ steps.pick.outputs.job }}"
          git config user.email "cyberview-jobs@users.noreply.github.com"
          d="EOF_$(openssl rand -hex 8)"
          { echo "text<<$d"; NO_HOUSEKEEPING=1 node scripts/job-prompt.mjs "${{ steps.pick.outputs.job }}"; echo; echo "Model for this run: ${{ steps.pick.outputs.model }}. This run is unattended, inside GitHub Actions: GH_TOKEN is set for gh."; echo "$d"; } >> "$GITHUB_OUTPUT"

      # one step per sign-in method: a static credential must not sit next to the federation inputs
      - name: Run the job with Claude (identity federation)
        if: env.AUTH == 'wif'
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          github_token: ${{ github.token }}
          prompt: ${{ steps.prompt.outputs.text }}
          show_full_output: ${{ inputs.debug == true }}
          claude_args: >-
            --model ${{ steps.pick.outputs.model }}
            --max-turns ${{ steps.pick.outputs.turns }}
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep,WebSearch,WebFetch,Task"
          anthropic_federation_rule_id: ${{ steps.auth.outputs.rule }}
          anthropic_organization_id: ${{ steps.auth.outputs.org }}
          anthropic_service_account_id: ${{ steps.auth.outputs.svac }}
          anthropic_workspace_id: ${{ steps.auth.outputs.ws }}

      - name: Run the job with Claude (API key)
        if: env.AUTH == 'apikey'
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          github_token: ${{ github.token }}
          prompt: ${{ steps.prompt.outputs.text }}
          show_full_output: ${{ inputs.debug == true }}
          claude_args: >-
            --model ${{ steps.pick.outputs.model }}
            --max-turns ${{ steps.pick.outputs.turns }}
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep,WebSearch,WebFetch,Task"
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Run the job with Claude (subscription token)
        if: env.AUTH == 'oauth'
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          github_token: ${{ github.token }}
          prompt: ${{ steps.prompt.outputs.text }}
          show_full_output: ${{ inputs.debug == true }}
          claude_args: >-
            --model ${{ steps.pick.outputs.model }}
            --max-turns ${{ steps.pick.outputs.turns }}
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep,WebSearch,WebFetch,Task"
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

      - name: Check what was pushed
        if: env.HAS_TOKEN == 'true' && always()
        run: |
          git fetch -q origin main
          git log --oneline -5 origin/main >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$(git status --porcelain)" ]; then echo "Uncommitted changes were left behind (not pushed):" >> "$GITHUB_STEP_SUMMARY"; git status --short | head -20 >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Alert on failure
        if: failure() && env.HAS_TOKEN == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "**AI job ${{ steps.pick.outputs.job }} failed** (model ${{ steps.pick.outputs.model }})." > report.md
          bash .github/scripts/alert.sh job-failure "AI job failing: ${{ steps.pick.outputs.job }}" report.md failing
