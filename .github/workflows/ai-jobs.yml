name: AI jobs
# Schedule registered 2026-11-18; times are UTC.

# The Claude research and maintenance jobs, run by Claude Code's GitHub Action on a schedule.
# Each run: check out main, build the prompt from docs/jobs.md (shared preamble + the job's section),
# let Claude do the job and commit to main, then the Pages workflow redeploys the site.
# Needs one repository secret: CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`). Without it every run
# skips in a few seconds. Schedule and models are listed in docs/jobs.md; change both together.
on:
  schedule:
    - cron: "10 */4 * * *"     # sweep, every 4 h
    - cron: "19 3,15 * * *"    # verify, twice a day
    - cron: "17 13 * * *"      # report review, daily
    - cron: "50 12 * * *"      # analysis, daily
    - cron: "17 9 * * 1,4"     # deep sweep, Mondays and Thursdays
    - cron: "40 11 * * *"      # brief, 6:40 am Toronto (winter)
    - cron: "30 14 * * *"      # watchdog, daily
    - cron: "5 8 * * 1"        # security review, Mondays
  workflow_dispatch:
    inputs:
      job:
        description: "Job to run"
        required: true
        type: choice
        options: [sweep, verify, report-review, analysis, deep-sweep, brief, watchdog, security-review]

permissions:
  contents: write
  issues: write
  id-token: write

concurrency:
  group: data-writes
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - name: Pick the job and model
        id: pick
        run: |
          case "${{ github.event.schedule }}" in
            "10 */4 * * *")  job=sweep ;;
            "19 3,15 * * *") job=verify ;;
            "17 13 * * *")   job=report-review ;;
            "50 12 * * *")   job=analysis ;;
            "17 9 * * 1,4")  job=deep-sweep ;;
            "40 11 * * *")   job=brief ;;
            "30 14 * * *")   job=watchdog ;;
            "5 8 * * 1")     job=security-review ;;
            *)               job="${{ inputs.job }}" ;;
          esac
          case "$job" in
            analysis|deep-sweep|security-review) model=claude-opus-5-5; turns=120 ;;
            watchdog)                            model=claude-haiku-5-5; turns=60 ;;
            *)                                   model=claude-sonnet-5-5; turns=100 ;;
          esac
          echo "job=$job" >> "$GITHUB_OUTPUT"; echo "model=$model" >> "$GITHUB_OUTPUT"; echo "turns=$turns" >> "$GITHUB_OUTPUT"
          echo "Job: $job, model: $model" >> "$GITHUB_STEP_SUMMARY"

      - name: Skip when the Claude token is not set
        if: env.HAS_TOKEN != 'true'
        run: echo "CLAUDE_CODE_OAUTH_TOKEN is not set; skipping ${{ steps.pick.outputs.job }}." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v4
        if: env.HAS_TOKEN == 'true'
        with:
          ref: main
          fetch-depth: 50

      - uses: actions/setup-node@v4
        if: env.HAS_TOKEN == 'true'
        with:
          node-version: "22"

      - name: Prepare
        id: prompt
        if: env.HAS_TOKEN == 'true'
        run: |
          git config user.name "cyberview-${{ steps.pick.outputs.job }}"
          git config user.email "cyberview-jobs@users.noreply.github.com"
          d="EOF_$(openssl rand -hex 8)"
          { echo "text<<$d"; node scripts/job-prompt.mjs "${{ steps.pick.outputs.job }}"; echo; echo "Model for this run: ${{ steps.pick.outputs.model }}. This run is unattended, inside GitHub Actions: GH_TOKEN is set for gh."; echo "$d"; } >> "$GITHUB_OUTPUT"

      - name: Run the job with Claude
        if: env.HAS_TOKEN == 'true'
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: ${{ steps.prompt.outputs.text }}
          claude_args: >-
            --model ${{ steps.pick.outputs.model }}
            --max-turns ${{ steps.pick.outputs.turns }}
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep,WebSearch,WebFetch,Task"

      - name: Check what was pushed
        if: env.HAS_TOKEN == 'true' && always()
        run: |
          git fetch -q origin main
          git log --oneline -5 origin/main >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$(git status --porcelain)" ]; then echo "Uncommitted changes were left behind (not pushed):" >> "$GITHUB_STEP_SUMMARY"; git status --short | head -20 >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Alert on failure
        if: failure() && env.HAS_TOKEN == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "**AI job ${{ steps.pick.outputs.job }} failed** (model ${{ steps.pick.outputs.model }})." > report.md
          bash .github/scripts/alert.sh job-failure "AI job failing: ${{ steps.pick.outputs.job }}" report.md failing
