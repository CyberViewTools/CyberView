name: AI launch

# Manual only (owner 2026-11-26): "Run workflow" runs any one AI job once on a GitHub runner, for testing. The scheduled
# web-independent jobs each have their own workflow with one schedule (job-triage.yml, job-brief.yml, job-improver.yml,
# job-analysis.yml, job-security-review.yml, job-tabletop.yml, sharing ai-job.yml), and the Library has library.yml:
# GitHub did not reliably start the 16 schedules this file used to hold. The web research jobs stay on the cloud launchers
# (runner IPs get bot-challenged on core news sources). Sign-in: CYBERVIEW_FALLBACK_ANTHROPIC_API_KEY (billed first with
# usage_budget.api_fallback.api_on_actions) or CLAUDE_CODE_OAUTH_TOKEN; ANTHROPIC_WORKSPACE_ID is sent as the
# anthropic-workspace-id header.

on:
  workflow_dispatch:
    inputs:
      job:
        description: "Job to run once"
        required: true
        type: choice
        options: [sweep, backlog, review, analyst, triage, brief, verify, advisory, regional, improver, analysis, report-review, security-review, tabletop, scout, library]

permissions:
  contents: write         # data commits on the data branch
  issues: write           # pipeline alerts; verify desk and moderator replies (scripts/issues.mjs, scripts/chat.mjs)
  actions: write          # finish.mjs starts the deploy after pushing data
  pull-requests: write    # finish.mjs proposes config/ and docs/ changes (scripts/propose.mjs)

# one run per job at a time (a second sweep waits for the first; the research loop's leader lease covers the rest);
# different jobs may overlap, as they do with the data workflows, and git-sync heals their data commits
concurrency:
  group: ai-launch-${{ inputs.job }}
  cancel-in-progress: false

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
      HAS_KEY: ${{ secrets.CYBERVIEW_FALLBACK_ANTHROPIC_API_KEY != '' }}
    steps:
      - name: Pick the job
        id: pick
        run: |
          job="${{ inputs.job }}"
          case "$job" in [a-z-]*) ;; *) echo "no job given"; exit 1 ;; esac
          # the Library bills only the API key; every other job starts with the API key or the subscription token
          if [ "$job" = library ]; then ready=$HAS_KEY; elif [ "$HAS_KEY" = true ] || [ "$HAS_OAUTH" = true ]; then ready=true; else ready=false; fi
          echo "READY=$ready" >> "$GITHUB_ENV"
          echo "job=$job" >> "$GITHUB_OUTPUT"; echo "Job: $job" >> "$GITHUB_STEP_SUMMARY"

      - name: Skip when no Claude sign-in is set up
        if: env.READY != 'true'
        run: |
          echo "No credential for ${{ steps.pick.outputs.job }} (every job needs the repository secret CYBERVIEW_FALLBACK_ANTHROPIC_API_KEY; jobs other than the Library may use CLAUDE_CODE_OAUTH_TOKEN from \`claude setup-token\` instead); skipping." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v4
        if: env.READY == 'true'
        with:
          ref: main
          fetch-depth: 50
          sparse-checkout: |
            /*
            !/data/
          sparse-checkout-cone-mode: false
      - name: Mount the data branch at ./data
        if: env.READY == 'true'
        uses: ./.github/actions/data

      - uses: actions/setup-node@v4
        if: env.READY == 'true'
        with:
          node-version: "22"

      - name: Install Claude Code
        if: env.READY == 'true'
        run: npm install -g @anthropic-ai/claude-code@2.1.331 && claude --version

      - name: Run the job
        id: run
        if: env.READY == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CYBERVIEW_FALLBACK_ANTHROPIC_API_KEY: ${{ secrets.CYBERVIEW_FALLBACK_ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          # handed to workers as their GH_TOKEN by scripts/run-job.mjs workerEnv (no proxy adds it on a runner)
          CYBERVIEW_WORKER_GH_TOKEN: ${{ github.token }}
          JOB: ${{ steps.pick.outputs.job }}
          WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
        run: |
          unset ANTHROPIC_API_KEY
          # a key that belongs to no workspace is refused without this header (API Error 400, 2026-11-26)
          if [ -n "$WORKSPACE_ID" ]; then export ANTHROPIC_CUSTOM_HEADERS="anthropic-workspace-id: $WORKSPACE_ID"; fi
          # the Library bills only the API key (scripts/run-job.mjs libraryServedNow hands it to each call as ANTHROPIC_API_KEY): no subscription token in reach
          if [ "$JOB" = library ]; then unset CLAUDE_CODE_OAUTH_TOKEN; fi
          node scripts/dispatch.mjs "$JOB" --exec 2>&1 | tee out.txt
          { echo '```'; tail -15 out.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          # DISPATCH means the job needs a session's judgment (headless unavailable); a runner has none, so say so loudly
          if grep -q '^DISPATCH' out.txt; then echo "::error::$JOB needs a Claude session (headless unavailable on this runner)"; exit 1; fi

      - name: Check what was pushed
        if: env.READY == 'true' && always()
        run: |
          d=.; [ -e data/.git ] && d=data
          git -C "$d" log --oneline -5 >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$(git -C "$d" status --porcelain)" ]; then echo "Uncommitted data was left behind (the next run commits it with finish.mjs --force):" >> "$GITHUB_STEP_SUMMARY"; git -C "$d" status --short | head -20 >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Alert on failure
        if: failure() && env.READY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "**AI launch failed: ${{ steps.pick.outputs.job }}** (run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})." > report.md
          bash .github/scripts/alert.sh job-failure "AI launch failing: ${{ steps.pick.outputs.job }}" report.md failing
