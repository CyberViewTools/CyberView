name: Validate, security check and test

# Code changes (page, scripts, tests, config): lint workflows, validate, static security check, unit tests, then the browser suite.
# Runs on every pull request to main (main takes code through pull requests) and on every code push to main. Code and
# data live on separate branches (scripts/lib/repo.mjs), so each job checks out main's code without data/ and mounts the
# current data branch at ./data (.github/actions/data): a pull request is checked against the real, current data.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore: ["data/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /*
            !/data/
          sparse-checkout-cone-mode: false
      # TODO: stop skipping feeds.yml and pipecheck.yml once Claude Code's fix for the unquoted
      # ': ' has merged (feeds.yml line 76, pipecheck.yml line 63).
      - name: Lint workflows (actionlint 1.7.12)
        run: |
          set -euo pipefail
          ver=1.7.12
          case "$(uname -m)" in
            x86_64) arch=amd64; sum=8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 ;;
            aarch64|arm64) arch=arm64; sum=325e971b6ba9bfa504672e29be93c24981eeb1c07576d730e9f7c8805afff0c6 ;;
            *) echo "no pinned actionlint build for $(uname -m)" >&2; exit 1 ;;
          esac
          dest="${RUNNER_TEMP:-/tmp}/actionlint-${ver}"
          mkdir -p "$dest"
          file="actionlint_${ver}_linux_${arch}.tar.gz"
          url="https://github.com/rhysd/actionlint/releases/download/v${ver}/${file}"
          curl -sSfL --retry 3 --retry-delay 2 --max-time 60 -o "${dest}/${file}" "$url"
          echo "${sum}  ${dest}/${file}" | sha256sum -c
          tar -xzf "${dest}/${file}" -C "$dest" actionlint
          files=()
          for f in .github/workflows/*.yml .github/workflows/*.yaml; do
            [ -e "$f" ] || continue
            case "$(basename "$f")" in
              feeds.yml|pipecheck.yml) continue ;;
            esac
            files+=("$f")
          done
          [ "${#files[@]}" -gt 0 ]
          # -shellcheck= : stylistic shellcheck findings must not fail CI. actionlint's own checks still do.
          "$dest/actionlint" -shellcheck= "${files[@]}"
      - name: Mount the data branch at ./data
        uses: ./.github/actions/data
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate data/ (the data branch) and build the bundle and archive
        run: node scripts/build.mjs
      - name: Security check
        run: node scripts/security-check.mjs
      - name: Every page, view, map layer and routine is described (config/about.json)
        run: node scripts/about.mjs check
      - name: Unit tests
        run: node --test tests/unit/*.test.mjs

  sql-security-tests:
    # the accounts schema, attacked from every role on a fresh Postgres (tests/sql/rls_test.sql)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /*
            !/data/
          sparse-checkout-cone-mode: false
      - name: Apply the migration twice and run the attacks
        env:
          PGPASSWORD: postgres
        run: |
          P="psql -h localhost -U postgres -v ON_ERROR_STOP=1 -q -tA"
          $P -c "create database t"
          for f in tests/sql/supabase_shim.sql supabase/migrations/0001_accounts.sql supabase/migrations/0001_accounts.sql tests/sql/rls_test.sql; do $P -d t -f "$f"; done | tee out.txt
          grep -q "SQL SECURITY TESTS: ALL PASS" out.txt

  browser-tests:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          sparse-checkout: |
            /*
            !/data/
          sparse-checkout-cone-mode: false
      - name: Did the page, scripts or tests change?
        id: changed
        run: |
          if git diff --name-only HEAD~1 HEAD 2>/dev/null | grep -qE '^(site/|scripts/|tests/|legal/|pages/|config/)'; then echo "run=yes" >> "$GITHUB_OUTPUT"; else echo "run=no" >> "$GITHUB_OUTPUT"; fi
      - name: Mount the data branch at ./data
        if: steps.changed.outputs.run == 'yes'
        uses: ./.github/actions/data
      - uses: actions/setup-node@v4
        if: steps.changed.outputs.run == 'yes'
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        if: steps.changed.outputs.run == 'yes'
        with:
          python-version: "3.12"
      - name: Install Playwright
        if: steps.changed.outputs.run == 'yes'
        run: pip install playwright && python -m playwright install --with-deps chromium
      - name: Browser regression suite
        if: steps.changed.outputs.run == 'yes'
        run: python tests/test_all.py
