name: Collect leads

# Every 30 minutes, no AI model: reads public RSS and Atom feeds from agencies, vendors and security news, then several
# news indexes and primary databases (scripts/osint.mjs), GDELT's 15-minute knowledge graph files (scripts/gdelt-gkg.mjs),
# and groups it all into stories (scripts/fuse.mjs).
# (scripts/collect.mjs) and appends new items to data/leads/<date>.jsonl. The AI sweep starts from these.
on:
  schedule:
    - cron: "11,41 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: write   # to start the deploy after committing data (scripts/lib/repo.mjs dispatchDeploy)

concurrency:
  group: data-writes
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15   # the optional grid steps (5 + 4 min caps) can never run the job out of time before the commit
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /*
            !/data/
          sparse-checkout-cone-mode: false
      - name: Mount the data branch at ./data
        uses: ./.github/actions/data
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Collect
        run: node scripts/collect.mjs
      - name: Other open sources (news indexes, breach and vulnerability databases, status pages, official breach registers)
        # a failing source is skipped and shown on the status page; it never stops the run
        run: node scripts/osint.mjs || true
      - name: GDELT knowledge graph files (news in English and 65 translated languages, no AI)
        # optional: a missing or failing file is retried on a later run and shown on the status page; this step can never
        # stop the commit. The research loop runs it every cycle; this backup stands down while it does (one writer at a time)
        continue-on-error: true
        timeout-minutes: 4
        run: |
          if node -e 'const l=(JSON.parse(require("fs").readFileSync("data/leases.json","utf8"))||{})["flow:leader"];process.exit(l&&Date.parse(l.until)>Date.now()?0:1)' 2>/dev/null; then echo "gdelt-gkg: the research loop is running (live leader lease); skipping"
          else node scripts/gdelt-gkg.mjs; fi
      - name: Clear obvious leads (no AI)
        run: node scripts/triage.mjs
      - name: Group leads into stories
        run: node scripts/fuse.mjs
      - name: Close what a rule can decide (routine bulletins, commentary, database rows)
        # optional: a fault here must never stop the leads being committed
        run: node scripts/backlog.mjs auto || true
      - name: Power outages reported in the news (publishers' own headlines, no AI)
        # optional: a failing news index is skipped and reported in data/grid/news.json; this step can never stop the commit
        continue-on-error: true
        timeout-minutes: 5
        # the research loop runs it every 15 minutes; this backup stands down while it does (one writer at a time)
        run: |
          if node -e 'const l=(JSON.parse(require("fs").readFileSync("data/leases.json","utf8"))||{})["flow:leader"];process.exit(l&&Date.parse(l.until)>Date.now()?0:1)' 2>/dev/null; then echo "grid-news: the research loop is running (live leader lease); skipping"
          elif node -e 'const s=JSON.parse(require("fs").readFileSync("data/status.json","utf8")),a=(Date.now()-Date.parse(s.last_grid_news_at||0))/6e4;process.exit(a<20?0:1)'; then echo "grid-news: the research loop ran it under 20 minutes ago; skipping"; else node scripts/grid-news.mjs; fi
      - name: Grid outages (map context from six operators' public feeds, no AI)
        # optional: a failing operator feed is kept as stale and reported; this step can never stop the commit
        continue-on-error: true
        timeout-minutes: 4
        # the research loop collects every few minutes; this backup stands down while it does (one writer at a time)
        run: |
          if node -e 'const l=(JSON.parse(require("fs").readFileSync("data/leases.json","utf8"))||{})["flow:leader"];process.exit(l&&Date.parse(l.until)>Date.now()?0:1)' 2>/dev/null; then echo "grid: the research loop is running (live leader lease); skipping"
          elif node -e 'const s=JSON.parse(require("fs").readFileSync("data/status.json","utf8")),a=(Date.now()-Date.parse(s.last_grid_at||0))/6e4;process.exit(a<20?0:1)'; then echo "grid: the research loop collected under 20 minutes ago; skipping"
          else node scripts/grid.mjs collect; node scripts/grid-analysis.mjs || echo "grid-analysis failed (optional)"; node scripts/grid-audit.mjs || echo "grid-audit failed (optional)"; fi
      - name: Validate
        run: node scripts/build.mjs --quarantine > /dev/null
      - name: Commit and push (the data branch; starts the deploy)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("data/status.json")).last_collect_new||0)')
          node scripts/data-commit.mjs "data: collect, $n new lead(s)" data/leads data/status.json data/osint.json $( [ -f data/breaches.json ] && echo data/breaches.json ) $( [ -f data/gdelt-gkg.json ] && echo data/gdelt-gkg.json ) data/runs data/grid data/context/grid.json $([ -d data/services ] && echo data/services)
      - name: Alert on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "**Lead collector failed.** New feed items are not being collected." > report.md
          bash .github/scripts/alert.sh job-failure "Lead collector is failing" report.md failing
