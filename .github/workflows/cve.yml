name: CVE corpus (CVE List, EPSS)
# Every CVE published since 1999, kept current. No AI model.
# The corpus (cache/cve, about 300,000 compact rows) is kept in the GitHub Actions cache (key cve-corpus-<run>), never
# committed; if the cache is evicted, the next run rebuilds it from the CVE List in about two minutes. Each run: download it, or build it from the CVE List's midnight release (first run, on request, or
# when it fell behind the change log), apply the CVE List's change log, attach EPSS once a day and CISA known-exploited
# dates, save it again, and file new notable CVEs (exploited per CISA, on KEV, or CVSS 9+) as leads for the
# research loop. Its commit starts a deploy, which publishes the lookup files.
on:
  schedule:
    - cron: "41 * * * *"
  push:
    branches: [main]
    paths: [".github/workflows/cve.yml", "scripts/cve.mjs", "scripts/lib/cve.mjs", "scripts/cve-baseline.sh"]
  workflow_dispatch:
    inputs:
      rebuild:
        description: "Rebuild the corpus from the CVE List's latest midnight release"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: cve-corpus
  cancel-in-progress: false

jobs:
  cve:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      CVE_CORPUS: ${{ github.workspace }}/cache/cve
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Restore the corpus (the newest copy saved by an earlier run)
        uses: actions/cache/restore@v4
        with:
          path: cache/cve
          key: cve-corpus-${{ github.run_id }}
          restore-keys: cve-corpus-
      - name: Is there a corpus?
        id: get
        run: |
          v=$(node -e 'try{console.log(require(process.env.CVE_CORPUS+"/state.json").version||0)}catch{console.log(0)}'); want=$(node -e 'import("./scripts/cve.mjs").then(m=>console.log(m.CORPUS_VERSION))')
          if [ "${{ inputs.rebuild }}" != "true" ] && [ "$v" = "$want" ]; then echo "have=1" >> "$GITHUB_OUTPUT"; else echo "have=0 (corpus version $v, code wants $want)"; echo "have=0" >> "$GITHUB_OUTPUT"; fi
      - name: Build every CVE since 1999 from the CVE List's midnight release (first run or rebuild)
        if: steps.get.outputs.have != '1'
        run: bash scripts/cve-baseline.sh
      - name: Apply the CVE List's changes since the last run
        id: delta
        run: |
          set +e; node scripts/cve.mjs delta; code=$?; set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          [ "$code" = 0 ] || [ "$code" = 4 ]
      - name: Rebuild when the corpus fell behind the change log, then catch up
        if: steps.delta.outputs.code == '4'
        run: bash scripts/cve-baseline.sh && node scripts/cve.mjs delta
      - name: EPSS scores (once a day) and CISA known-exploited dates
        run: |
          if [ "$(node -e 'const s=require(process.env.CVE_CORPUS+"/state.json");console.log(s.epss_date||"")')" != "$(date -u +%F)" ]; then node scripts/cve.mjs epss || echo "EPSS unavailable; keeping yesterday's scores"; fi
          node scripts/cve.mjs kev
      - name: NVD's own scores (a full read the first time, about 25 minutes; then only NVD's changes)
        continue-on-error: true
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: node scripts/cve.mjs nvd
      - name: Audit our counts against NVD and CISA
        continue-on-error: true
        run: node scripts/cve.mjs audit && node scripts/cve.mjs stats
      - name: Save the corpus for the next run and the deploy
        uses: actions/cache/save@v4
        with:
          path: cache/cve
          key: cve-corpus-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Commit new leads and the run time (starts a deploy)
        run: |
          git config user.name "cyberview-feeds"
          git config user.email "cyberview-feeds@users.noreply.github.com"
          node -e 'const f="data/status.json",fs=require("fs"),s=JSON.parse(fs.readFileSync(f)),c=require(process.env.CVE_CORPUS+"/state.json");s.last_cve_at=new Date().toISOString().replace(/\.\d+Z$/,"Z");s.cve_total=c.total||s.cve_total;s.cve_note=`${c.total||"?"} CVEs; changes to ${c.delta_since||"?"}; EPSS ${c.epss_date||"?"}; ${(c.pending||[]).length} waiting`;fs.writeFileSync(f,JSON.stringify(s,null,2)+"\n")'
          git add data/leads data/status.json
          if git diff --cached --quiet; then echo "Nothing to commit."; exit 0; fi
          git commit -q -m "data: CVE corpus updated"
          node scripts/git-sync.mjs
      - name: Alert on failure
        if: failure()
        run: |
          echo "**CVE corpus job failed.** The CVE lookup is not updating; the site keeps the last published copy." > report.md
          bash .github/scripts/alert.sh job-failure "CVE corpus job is failing" report.md failing
