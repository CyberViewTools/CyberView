name: Link check

# Weekly check of every source link from the last 30 days (scripts/linkcheck.mjs). No AI model.
# Writes data/linkcheck.json; the data steward job replaces or removes broken sources.
on:
  schedule:
    - cron: "29 4 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-writes
  cancel-in-progress: false

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check links
        run: node scripts/linkcheck.mjs
      - name: Validate
        run: node scripts/build.mjs --quarantine
      - name: Commit and push
        run: |
          git config user.name "cyberview-linkcheck"
          git config user.email "cyberview-linkcheck@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git commit -q -m "data: link check"
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep $((i*15)); done
          exit 1
