name: Link check

# Weekly check of every source link from the last 30 days (scripts/linkcheck.mjs). No AI model.
# Writes data/linkcheck.json; the data steward job replaces or removes broken sources.
on:
  schedule:
    - cron: "29 4 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # to start the deploy after committing data

concurrency:
  group: data-writes
  cancel-in-progress: false

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /*
            !/data/
          sparse-checkout-cone-mode: false
      - name: Mount the data branch at ./data
        uses: ./.github/actions/data
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check links
        run: node scripts/linkcheck.mjs
      - name: Validate
        run: node scripts/build.mjs --quarantine
      - name: Commit and push (the data branch; starts the deploy)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/data-commit.mjs "data: link check"
