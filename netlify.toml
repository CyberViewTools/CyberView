# CyberView moved to GitHub Pages: https://xanderhutch.github.io/CyberView
# Netlify now only redirects old links (including #e= permalinks and feed URLs) to the same path there.
# Builds are skipped unless this file changes (scripts/netlify-ignore.sh), so Netlify uses no more credits.
[build]
  publish = "site"
  command = "node scripts/build.mjs"
  ignore = "bash scripts/netlify-ignore.sh"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/*"
  to = "https://xanderhutch.github.io/CyberView/:splat"
  status = 301
  force = true
