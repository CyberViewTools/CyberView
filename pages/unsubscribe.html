<section class="intro">
  <h1>Stop email alerts</h1>
  <p>This turns off CyberView alerts for the address the email was sent to. You do not need to sign in.</p>
</section>
<section class="panel">
  <div class="row"><button type="button" class="btn" id="unsub">Unsubscribe</button></div>
  <p class="note" id="unsubMsg" aria-live="polite"></p>
  <p class="note">Changed your mind later? Turn alerts back on from your <a href="account.html">account</a>.</p>
</section>
