<!DOCTYPE html>
<!--
  CyberView. Static page: reads one file, data/bundle.json, built from the repository's data/ folder by scripts/build.mjs.
  Sections, in order: design tokens and styles; markup; script (configuration tables CATS / LAYERS / SECG / LENS at the top,
  then data cleaning, feed, detail, insights, analysis views, map, controls, data store).
  Every record is passed through a clean*() function before use; add new fields there.
  Before merging a change: bump BUILD in the script and run tests/test_all.py (must print ALL PASS). See CLAUDE.md.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CyberView</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="icon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="color-scheme" content="dark">
<script>document.documentElement.dataset.theme="dark";</script>
<style>
/* Layout idea: the map is the whole stage; frosted glass panels (bar, feed, day strip) float over it. */
:root{
  --bg0:#ffffff; --bg1:#dcebfb; --glow:rgba(30,128,255,.22);
  --glass:rgba(255,255,255,.74); --glass-hi:rgba(255,255,255,1); --glass-brd:rgba(255,255,255,.95);
  --solid:#ffffff; --ink:#0b1b33; --muted:#4d6382; --line:rgba(20,60,120,.13);
  --land:rgba(255,255,255,.96); --land-line:rgba(40,100,190,.42); --grat:rgba(40,100,190,.13);
  --accent:#0a6cf0; --shadow:0 20px 50px rgba(30,90,180,.20),0 2px 6px rgba(30,90,180,.10);
  --c-incident:#d43a22; --c-vuln:#b06f00; --c-report:#6a48c7; --c-policy:#0b7f7a;
  --c-investment:#2f7f3a; --c-enforcement:#1f5fbf; --c-outage:#5d6975;
  --ok:#1f8a4c; --warn:#a86a00; --bad:#c8371f;
  --font-display:"Outfit","Avenir Next","Segoe UI",sans-serif;
  --font-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{position:relative;overflow:hidden;color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.45;
  background:radial-gradient(1000px 640px at 18% 12%,var(--glow),transparent 70%),radial-gradient(820px 560px at 82% 88%,var(--glow),transparent 70%),radial-gradient(600px 400px at 55% 45%,rgba(255,255,255,.9),transparent 70%),linear-gradient(165deg,var(--bg0),var(--bg1))}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.glass{background:linear-gradient(180deg,var(--glass-hi) 0,rgba(255,255,255,.35) 46%,transparent 47%),linear-gradient(120deg,rgba(255,255,255,.55),transparent 38%),var(--glass);border:1px solid var(--glass-brd);border-radius:18px;
  -webkit-backdrop-filter:blur(20px) saturate(150%);backdrop-filter:blur(20px) saturate(150%);box-shadow:var(--shadow),inset 0 1px 0 var(--glass-hi)}

#stage{position:absolute;inset:0}
#svg{display:block;width:100%;height:100%;touch-action:none}
.grat{fill:none;stroke:var(--grat);stroke-width:.6;vector-effect:non-scaling-stroke}
.sphere{fill:none;stroke:var(--land-line);stroke-opacity:.5;stroke-width:1;vector-effect:non-scaling-stroke}
.country{fill:var(--land);stroke:var(--land-line);stroke-width:.6;vector-effect:non-scaling-stroke;transition:fill .25s}
.country.has{cursor:pointer}
.country.on{stroke:var(--accent);stroke-width:1.8}
.m{cursor:pointer}
.m path{stroke:var(--solid);stroke-width:1.2}
.m.hollow path{fill:var(--solid);stroke-width:2.2}
.m .ring{fill:none;stroke:var(--ink);stroke-width:2}
.m .pulse{fill:none;stroke-width:1.5;transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-out infinite}
@keyframes pulse{0%{transform:scale(.6);opacity:.9}100%{transform:scale(2.3);opacity:0}}
.cl circle{fill:var(--solid);stroke:var(--accent);stroke-width:1.6}
.cl text{font-family:var(--font-mono);font-size:11px;font-weight:500;fill:var(--ink);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.cl.sel circle{stroke:var(--ink);stroke-width:3}
#tip{position:absolute;pointer-events:none;background:var(--solid);color:var(--ink);border:1px solid var(--glass-brd);box-shadow:var(--shadow);padding:6px 9px;border-radius:9px;font-size:12px;max-width:260px;transform:translate(-50%,-140%);display:none;z-index:4}
#tip small{display:block;color:var(--muted);font-family:var(--font-mono);font-size:10.5px}
.zoomer{position:absolute;left:14px;top:calc(var(--hdr,96px) + 26px);display:flex;flex-direction:column;border-radius:12px;overflow:hidden;z-index:2}
.zoomer button{width:34px;height:32px;border:0;border-top:1px solid var(--line);background:transparent;font-size:16px;line-height:1}
.zoomer button:first-child{border-top:0}
.zoomer button:hover,.icon:hover,.seg button:hover,.chip:hover{background:var(--glass-hi)}

.ui{position:absolute;inset:12px;display:grid;grid-template-columns:minmax(0,1fr) 430px;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;pointer-events:none;z-index:3}
.ui>*{pointer-events:auto}
header{grid-column:1/3;padding:12px 16px;display:flex;flex-direction:column;gap:10px}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px}
h1{font-family:var(--font-display);font-weight:700;font-size:21px;letter-spacing:-.01em;margin:0;display:flex;align-items:center;gap:9px}
.logo{width:26px;height:26px;image-rendering:pixelated;flex:none}
.live{width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px color-mix(in srgb,var(--ok) 25%,transparent)}
.live.off{background:var(--bad);box-shadow:0 0 0 4px color-mix(in srgb,var(--bad) 25%,transparent)}
.stats{color:var(--muted);font-family:var(--font-mono);font-size:12px;font-variant-numeric:tabular-nums}
.stats b{color:var(--ink);font-weight:500}
.spacer{flex:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{background:transparent;border:0;padding:6px 11px;font-family:var(--font-mono);font-size:12px;border-left:1px solid var(--line)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:linear-gradient(180deg,#4d9bff,var(--accent));color:#fff}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid color-mix(in srgb,var(--accent) 70%,#fff);border-radius:10px;padding:6px 12px;font-weight:600;color:#fff;
  background:linear-gradient(180deg,#4d9bff 0,var(--accent) 55%,#0757c4 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 4px 12px rgba(10,108,240,.30)}
.btn.ghost{color:var(--ink);background:linear-gradient(180deg,#fff,#eaf2fc);border-color:var(--line);box-shadow:inset 0 1px 0 #fff,0 2px 6px rgba(30,90,180,.12)}
.btn:hover{border-color:var(--accent)}
.btn svg{width:15px;height:15px}
.btn.spin svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.row2{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;background:transparent;border:1px solid var(--line);border-radius:999px;padding:4px 10px 4px 7px;font-size:12.5px}
.chip svg{width:14px;height:14px;flex:none}
.chip .n{font-family:var(--font-mono);font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.chip[aria-pressed="false"]{opacity:.45;text-decoration:line-through}
.chip.tog[aria-pressed="false"]{opacity:1;text-decoration:none}
.chip.tog[aria-pressed="true"]{background:linear-gradient(180deg,#4d9bff,var(--accent));color:#fff;border-color:var(--accent)}

.days{grid-column:1;grid-row:3;justify-self:start;display:flex;gap:6px;padding:10px 14px 9px;align-items:flex-end;width:min(100%,560px)}
.day{flex:1;min-width:0;background:transparent;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:3px}
.day .cnt{font-family:var(--font-mono);font-size:11px;font-variant-numeric:tabular-nums}
.day .bar{width:100%;max-width:46px;background:linear-gradient(180deg,var(--accent),color-mix(in srgb,var(--accent) 45%,transparent));opacity:.7;border-radius:4px 4px 1px 1px;min-height:2px}
.day .lab{font-family:var(--font-mono);font-size:10.5px;color:var(--muted);white-space:nowrap}
.day[aria-pressed="true"] .bar{opacity:1}
.day[aria-pressed="true"] .lab{color:var(--ink);font-weight:500}
.day.dim .bar{opacity:.25}
.key{grid-column:1;grid-row:2;justify-self:end;align-self:end;padding:8px 12px;font-size:11.5px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap;border-radius:12px;max-width:46%}
.key span{display:inline-flex;align-items:center;gap:5px}
.key svg{width:13px;height:13px}

aside{grid-column:2;grid-row:2/4;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.tabs{display:flex;gap:4px;padding:10px 12px 0}
.tabs button{flex:1;background:transparent;border:0;border-bottom:2px solid transparent;padding:6px 4px 9px;font-family:var(--font-display);font-weight:600;font-size:14px;color:var(--muted)}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tools{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.tools input,.tools select{background:color-mix(in srgb,var(--solid) 55%,transparent);border:1px solid var(--line);border-radius:10px;padding:6px 9px;min-width:0}
.tools input{flex:1}
.tools select{max-width:128px}
.note{margin:8px 12px 0;padding:7px 10px;border:1px dashed var(--line);border-radius:10px;font-size:12.5px;color:var(--muted);display:flex;gap:8px;align-items:center;justify-content:space-between}
.note button{background:transparent;border:1px solid var(--line);border-radius:7px;padding:2px 8px;font-size:12px}
.pane{list-style:none;margin:0;padding:10px 12px 16px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:8px}
.card{border:1px solid var(--line);border-left:4px solid var(--cc);border-radius:12px;background:color-mix(in srgb,var(--solid) 60%,transparent);transition:border-color .15s,box-shadow .15s}
.card:hover{box-shadow:0 6px 18px rgba(0,0,0,.14)}
.card.s1{border-left-width:2px}.card.s3{border-left-width:6px}
.card.sel{border-color:var(--accent);border-left-color:var(--cc);background:var(--solid)}
.card.fresh{box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 55%,transparent)}
.head{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;width:100%;text-align:left;background:transparent;border:0;padding:9px 10px}
.head svg{width:15px;height:15px;margin-top:2px}
.meta{font-family:var(--font-mono);font-size:11px;color:var(--muted);display:flex;flex-wrap:wrap;gap:0 8px;align-items:center}
.meta .cat{color:var(--cc)}
.ttl{grid-column:2;font-weight:600;font-size:14px;line-height:1.3}
.sub{grid-column:2;font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.pill{font-family:var(--font-mono);font-size:10.5px;border:1px solid currentColor;border-radius:999px;padding:0 6px;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap}
.pill.warn{color:var(--warn)}.pill.new{color:var(--accent)}.pill.mute{color:var(--muted)}
.conf{display:inline-flex;align-items:center;gap:5px;font-family:var(--font-mono);font-size:10.5px;color:var(--muted);white-space:nowrap}
.conf i{display:inline-block;width:9px;height:4px;border-radius:2px;background:var(--line)}
.conf.c1 i:nth-child(-n+1){background:var(--bad)}
.conf.c2 i:nth-child(-n+2){background:var(--warn)}
.conf.c3 i:nth-child(-n+3){background:var(--ok)}
.body{padding:0 10px 11px 33px;font-size:13px}
.body p{margin:0 0 8px;max-width:65ch}
.body dl{margin:0 0 8px;display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:12.5px}
.body dt{color:var(--muted)}
.body dd{margin:0;overflow-wrap:anywhere}
.body .mono{font-family:var(--font-mono);font-size:11.5px}
.body a{color:var(--accent)}
.val{border:1px solid var(--line);border-radius:10px;padding:7px 9px;margin:0 0 8px;font-size:12.5px}
.val b{font-weight:600}
.val.v-ok b{color:var(--ok)}.val.v-warn b{color:var(--warn)}.val.v-bad b{color:var(--bad)}
.val small{display:block;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin:0 0 8px}
.tag{font-family:var(--font-mono);font-size:10.5px;background:color-mix(in srgb,var(--accent) 14%,transparent);border-radius:6px;padding:1px 6px}
.srcs{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;margin-bottom:8px}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.acts button{background:transparent;border:1px solid var(--line);border-radius:8px;padding:3px 9px;font-size:12px}
.acts button:hover{border-color:var(--accent)}
.rel{margin:8px 0 0;padding:0;list-style:none;font-size:12.5px}
.rel button{background:transparent;border:0;padding:1px 0;color:var(--accent);text-align:left}
.empty{color:var(--muted);padding:24px 8px;text-align:center}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.kpi{border:1px solid var(--line);border-radius:12px;padding:8px 9px;background:color-mix(in srgb,var(--solid) 55%,transparent)}
.kpi b{display:block;font-family:var(--font-display);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15}
.kpi span{font-size:11px;color:var(--muted)}
.blk{border:1px solid var(--line);border-radius:12px;padding:10px;background:color-mix(in srgb,var(--solid) 55%,transparent)}
.blk h3{margin:0 0 7px;font-family:var(--font-display);font-size:13px;font-weight:600}
.brow{display:grid;grid-template-columns:minmax(0,42%) 1fr auto;gap:8px;align-items:center;width:100%;background:transparent;border:0;padding:3px 0;text-align:left;font-size:12.5px}
.brow span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow .tr{height:7px;border-radius:4px;background:var(--line);overflow:hidden}
.brow .tr i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent) 50%,transparent))}
.brow .v{font-family:var(--font-mono);font-size:11.5px;font-variant-numeric:tabular-nums}
button.brow:hover span:first-child{color:var(--accent)}
.sys{display:grid;grid-template-columns:1fr auto;gap:3px 10px;font-size:12.5px}
.sys dt{color:var(--muted)}.sys dd{margin:0;font-family:var(--font-mono);font-size:11.5px;text-align:right}
.sys .late{color:var(--bad)}

.edge{fill:none;stroke-width:1.5}
.edge.stated{stroke:var(--accent)}
.edge.inferred{stroke:var(--c-report);stroke-dasharray:6 4}
.edge.timing{stroke:var(--muted);stroke-dasharray:1 5;stroke-linecap:round;stroke-width:2}
.edge.auto{stroke:var(--muted);stroke-opacity:.5;stroke-width:1}
.hull{fill:color-mix(in srgb,var(--accent) 7%,transparent);stroke:color-mix(in srgb,var(--accent) 35%,transparent);stroke-dasharray:3 4}
.hull.on{fill:color-mix(in srgb,var(--accent) 16%,transparent);stroke:var(--accent);stroke-dasharray:none}
.glab{font-family:var(--font-display);font-size:12px;font-weight:600;fill:var(--ink);text-anchor:middle;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round;cursor:pointer}
.chainline{fill:none;stroke:var(--accent);stroke-width:2.2;stroke-dasharray:7 5}
.stepn circle{fill:var(--accent)}.stepn text{fill:#fff;font-family:var(--font-mono);font-size:9.5px;text-anchor:middle;dominant-baseline:central}
.axis text{font-family:var(--font-mono);font-size:10.5px;fill:var(--muted)}
.gridl{stroke:var(--line)}.lanebg{fill:rgba(255,255,255,.55);stroke:var(--line)}
.lanelab{font-family:var(--font-display);font-size:12px;font-weight:600}
.nowl{stroke:var(--bad);stroke-width:1.2;stroke-dasharray:3 3}
.pcard{border:1px solid var(--line);border-radius:12px;padding:10px;background:color-mix(in srgb,var(--solid) 60%,transparent)}
.pcard.on{border-color:var(--accent);background:var(--solid)}
.pcard h3{margin:0 0 4px;font-family:var(--font-display);font-size:14.5px;font-weight:600}
.pcard p{margin:0 0 7px;font-size:13px}
.pcard .cav{color:var(--muted);font-size:12.5px;border-left:3px solid var(--warn);padding-left:8px}
.pcard ol{margin:0 0 8px;padding-left:20px;font-size:12.5px}
.pcard ol button{background:transparent;border:0;padding:1px 0;color:var(--accent);text-align:left}
.pcard ol small{font-family:var(--font-mono);color:var(--muted)}
.pk{font-family:var(--font-mono);font-size:10.5px;border-radius:999px;padding:1px 7px;border:1px solid currentColor;text-transform:uppercase;letter-spacing:.03em}
.pk.stated{color:var(--accent)}.pk.inferred{color:var(--c-report)}.pk.timing{color:var(--muted)}
.warnbox{border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:10px;padding:8px 10px;font-size:12.5px;color:var(--muted);background:color-mix(in srgb,var(--solid) 60%,transparent)}
.seg button:focus-visible{outline-offset:-2px}
.seg button[aria-pressed="true"]:focus-visible{outline-color:#fff}
.chip.tog[aria-pressed="true"] .n{color:#fff}
.chip.tog{padding-left:10px}
.chip:disabled{opacity:.45;cursor:default}
.btn.sm{padding:4px 11px;font-size:12.5px;border-radius:999px}
.stats .wlstat{color:var(--accent);font-weight:600}
.tools.t1{border-bottom:0;padding-bottom:0}
.tools.t2{border-top:0;padding-top:8px;align-items:center}
.tools #lens{max-width:none;flex:1}
.tools .seg button{padding:6px 9px;font-size:11.5px}
.tier{white-space:nowrap}
.tier.aggregator{color:var(--warn)}
.pill.wl{color:#fff;background:var(--accent);border-color:var(--accent)}
.pill.kev{color:var(--bad)}
.todo.rep{border-left-color:var(--c-report);background:color-mix(in srgb,var(--c-report) 5%,var(--solid))}
.todo ul{margin:2px 0 6px;padding-left:18px}.todo li{margin:2px 0}
.todo{border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);border-left:4px solid var(--accent);border-radius:10px;padding:7px 9px;margin:0 0 8px;font-size:12.5px;background:color-mix(in srgb,var(--accent) 6%,var(--solid))}
.todo h4{margin:0 0 3px;font-family:var(--font-display);font-size:12.5px;font-weight:600;color:var(--accent)}
.todo p{margin:0}
.cvet{display:grid;grid-template-columns:auto auto auto 1fr;gap:3px 10px;margin-top:6px;font-family:var(--font-mono);font-size:11px;align-items:center}
.todo p+.cvet{border-top:1px solid var(--line);padding-top:6px}
.cvet .h{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.03em}
.cvet .k{display:flex;flex-wrap:wrap;gap:2px 6px;align-items:center;color:var(--muted)}
.rep{margin-top:8px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.rep textarea,#wlText{width:100%;min-height:64px;resize:vertical;font:inherit;font-size:12.5px;border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--solid);color:var(--ink)}
.rep .msg{color:var(--bad);font-size:12.5px}
.m .wlr,.cl .wlr{fill:none;stroke:var(--accent);stroke-width:2.4}
.m .act{fill:none;stroke:var(--ink);stroke-width:1.3;stroke-dasharray:3 2.5}
.m .ctry{fill:none;stroke:var(--muted);stroke-width:1.3;stroke-dasharray:.5 3;stroke-linecap:round}
.key svg.rg{width:16px;height:16px}
.key .wlr{fill:none;stroke:var(--accent);stroke-width:2.2}.key .act{fill:none;stroke:var(--ink);stroke-width:1.3;stroke-dasharray:3 2.5}.key .ctry{fill:none;stroke:var(--muted);stroke-width:1.4;stroke-dasharray:.5 3;stroke-linecap:round}
#wlDlg{position:absolute;right:454px;top:calc(var(--hdr,96px) + 24px);width:380px;max-width:calc(100% - 24px);padding:14px;z-index:5;display:flex;flex-direction:column;gap:8px}
#wlDlg h2{margin:0;font-family:var(--font-display);font-size:16px;font-weight:600}
#wlDlg p{margin:0;font-size:12.5px;color:var(--muted)}
#wlDlg .dacts{display:flex;gap:8px;justify-content:flex-end}
#wlText{min-height:110px}
#wlNote{color:var(--ink)}
.bhd{font-family:var(--font-display);font-size:17px;font-weight:600;line-height:1.25;margin:0 0 3px}
.bitems{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;counter-reset:bi}
.bitems li{counter-increment:bi;position:relative;padding-left:40px}
.bitems li::before{content:counter(bi);position:absolute;left:10px;top:10px;width:21px;height:21px;border-radius:50%;background:var(--accent);color:#fff;font-family:var(--font-mono);font-size:11px;display:flex;align-items:center;justify-content:center}
.bitems h3{font-size:14px}
.bitems .do{font-size:12.5px;border-left:3px solid var(--accent);padding-left:8px}
.hist svg{display:block;width:100%;height:auto}
.hist .hb{fill:var(--accent);opacity:.3}.hist .hb.wk{opacity:1}
.hist .hbl{stroke:var(--line)}
.hax{display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:10.5px;color:var(--muted)}
.blk p{margin:6px 0 0;font-size:12.5px}
.corr{margin:0;padding:0;list-style:none;font-size:12.5px;display:flex;flex-direction:column;gap:6px}
.corr small{display:block;font-family:var(--font-mono);font-size:10.5px;color:var(--muted)}
.corr button{background:transparent;border:0;padding:0;color:var(--accent);text-align:left;font-weight:600}
details.blk summary{cursor:pointer;font-family:var(--font-display);font-size:13px;font-weight:600}
details.blk ul{margin:7px 0 0;padding-left:18px;font-size:12.5px}
#toast{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);padding:9px 14px;border-radius:12px;font-size:13px;z-index:6;max-width:min(92%,520px);text-align:center}

.tools select{max-width:none;flex:1}
.dbar{display:flex;gap:6px;align-items:center;padding:10px 12px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.dbar>button{background:linear-gradient(180deg,#fff,#eaf2fc);border:1px solid var(--line);border-radius:9px;padding:5px 10px;font-size:12.5px;font-weight:600}
.dbar>button:hover:not(:disabled){border-color:var(--accent)}
.dbar>button:disabled{opacity:.4;cursor:default}
.dbar .seg button{padding:5px 8px;font-size:11px}
#detail{animation:slidein .16s ease-out}
@keyframes slidein{from{opacity:0;transform:translateX(10px)}to{opacity:1;transform:none}}
#detail .card{border-color:var(--accent);background:var(--solid)}
#detail .head{cursor:default}
#detail .ttl{font-size:16px}
.tri{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 0 9px}
.tri button{border:1px solid var(--line);border-radius:9px;padding:5px 11px;font-size:12.5px;font-weight:600;background:linear-gradient(180deg,#fff,#eaf2fc)}
.tri button.go{color:#fff;border-color:var(--accent);background:linear-gradient(180deg,#4d9bff,var(--accent))}
.tri button:hover{border-color:var(--accent)}
.tri kbd,.keys kbd{font-family:var(--font-mono);font-size:10.5px;border:1px solid currentColor;border-radius:4px;padding:0 4px;opacity:.7;margin-left:5px}
.tri .state{font-size:12.5px;color:var(--ok);font-weight:600}
.card.done{opacity:.55}
.card.done .ttl{font-weight:500}
.pill.ok{color:var(--ok)}
.do{grid-column:2;font-size:12.5px;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:2px}
.do b{color:var(--accent);font-weight:600}
.key.shut{padding:0;border-radius:10px}
.key.shut>span{display:none}
.key .kt{background:transparent;border:0;font-size:11.5px;color:var(--muted);padding:0 2px;font-weight:600}
.key.shut .kt{padding:6px 11px}
.keys{font-size:11.5px;color:var(--muted);padding:0 12px 9px}
@media (max-width:900px){.dbar{flex-wrap:wrap}}
@media (max-width:900px){
  html,body{height:auto}
  body{overflow:auto;display:flex;flex-direction:column;gap:10px;padding:10px}
  .ui{display:contents}
  header{order:1}
  #stage{position:relative;inset:auto;height:340px;order:2;border-radius:18px;overflow:hidden;border:1px solid var(--glass-brd)}
  .days{order:3;width:100%}
  aside{order:4;overflow:visible}
  .pane{overflow:visible}
  .key{display:none}
  .zoomer{top:12px}
  .kpis{grid-template-columns:repeat(2,1fr)}
  #wlDlg{position:fixed;left:10px;right:10px;top:60px;width:auto;max-width:none}
  .tools{flex-wrap:wrap}
  #toast{position:fixed}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---- system-style glass theme (overrides) ---- */
:root{
  --bg0:#f2f4f8; --bg1:#dfe4ec; --glow:rgba(90,150,255,.20);
  --glass:rgba(255,255,255,.58); --glass-hi:rgba(255,255,255,.92); --glass-brd:rgba(255,255,255,.72);
  --solid:#ffffff; --ink:#1c1c1e; --muted:#5c5f66; --line:rgba(60,60,67,.14);
  --land:rgba(255,255,255,.88); --land-line:rgba(60,70,90,.32); --grat:rgba(60,70,90,.10);
  --accent:#0071e3; --fill:rgba(118,118,128,.13); --tint:rgba(0,113,227,.11); --switch:#34c759;
  --shadow:0 12px 40px rgba(20,30,50,.12),0 1px 3px rgba(20,30,50,.08);
  --font-display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-mono:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
body{background:radial-gradient(900px 600px at 12% 8%,rgba(120,170,255,.28),transparent 70%),radial-gradient(800px 560px at 88% 92%,rgba(170,140,255,.18),transparent 70%),radial-gradient(700px 480px at 70% 20%,rgba(120,220,200,.14),transparent 70%),linear-gradient(165deg,var(--bg0),var(--bg1));-webkit-font-smoothing:antialiased}
.cvet,.body .mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.glass{background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,.22)),var(--glass);border:1px solid var(--glass-brd);border-radius:24px;
  -webkit-backdrop-filter:blur(30px) saturate(190%);backdrop-filter:blur(30px) saturate(190%);box-shadow:var(--shadow),inset 0 1px 0 var(--glass-hi),inset 0 -1px 0 rgba(255,255,255,.25)}
h1{font-weight:700;letter-spacing:-.02em}
.stats,.meta,.conf,.pill,.tag,.day .cnt,.day .lab,.brow .v,.chip .n{font-variant-numeric:tabular-nums;letter-spacing:0}
.stats{font-size:12.5px}
/* buttons */
.btn{background:var(--accent);border:0;border-radius:12px;padding:8px 15px;box-shadow:none;transition:filter .15s,transform .1s}
.btn:hover{filter:brightness(1.07)}.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--tint);color:var(--accent);box-shadow:none}
.btn.sm{border-radius:10px;padding:6px 12px}
/* segmented controls */
.seg{border:0;background:var(--fill);border-radius:10px;padding:2px;gap:0}
.seg button,.tools .seg button,.dbar .seg button{border:0;border-radius:8px;padding:5px 11px;font-size:12.5px;font-weight:500;color:var(--ink);transition:background .15s,box-shadow .15s}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.16),0 0 0 .5px rgba(0,0,0,.04);font-weight:600}
.seg button[aria-pressed="true"]:focus-visible{outline-color:var(--accent)}
.seg button:hover:not([aria-pressed="true"]){background:rgba(255,255,255,.45)}
/* chips and switches */
.chip{border:0;background:rgba(255,255,255,.72);box-shadow:0 1px 2px rgba(20,30,50,.08);padding:6px 12px 6px 9px;font-size:13px;transition:opacity .15s,background .15s}
.chip:hover{background:#fff}
.chip.tog,.chip.tog[aria-pressed="true"]{position:relative;background:rgba(255,255,255,.72);color:var(--ink);padding:6px 56px 6px 12px}
.chip.tog[aria-pressed="true"] .n{color:var(--muted)}
.chip.tog::before{content:"";position:absolute;right:9px;top:50%;width:36px;height:22px;margin-top:-11px;border-radius:999px;background:rgba(120,120,128,.28);transition:background .2s}
.chip.tog::after{content:"";position:absolute;right:25px;top:50%;width:18px;height:18px;margin-top:-9px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.28);transition:transform .2s}
.chip.tog[aria-pressed="true"]::before{background:var(--switch)}
.chip.tog[aria-pressed="true"]::after{transform:translateX(14px)}
/* fields */
.tools{border:0!important;padding:10px 12px 0}
.tools.t2{padding-bottom:10px;border-bottom:1px solid var(--line)!important}
.tools input,.tools select,#wlDlg textarea{background:var(--fill);border:0;border-radius:10px;padding:8px 11px}
.tools input::placeholder{color:var(--muted)}
/* tabs as a segmented control */
.tabs{margin:12px 12px 0;padding:2px;gap:0;background:var(--fill);border-radius:11px}
.tabs button{border:0;border-radius:9px;padding:6px 4px;font-size:13px;font-weight:500;color:var(--ink);transition:background .15s}
.tabs button[aria-selected="true"]{background:#fff;font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.16)}
/* cards */
.card{border:0;border-left:4px solid var(--cc);border-radius:16px;background:rgba(255,255,255,.8);box-shadow:0 1px 2px rgba(20,30,50,.07)}
.card:hover{box-shadow:0 6px 18px rgba(20,30,50,.12);background:#fff}
.card.sel{box-shadow:0 0 0 2px var(--accent);background:#fff}
#detail .card{box-shadow:0 1px 2px rgba(20,30,50,.07)}
.head{padding:11px 12px}
.todo,.val{border-radius:14px}
.val{border:0;background:var(--fill)}
.kpi{border:0;border-radius:16px;background:rgba(255,255,255,.8);box-shadow:0 1px 2px rgba(20,30,50,.07)}
.tag{border-radius:999px;padding:2px 8px;background:var(--tint);color:var(--accent)}
.note{border:0;background:var(--fill);border-radius:12px}
/* small action buttons */
.acts button,.note button,.dbar>button,.tri button,.zoomer button{transition:background .15s,transform .1s}
.acts button,.note button,.dbar>button,.tri button{background:var(--tint);color:var(--accent);border:0;border-radius:10px;padding:6px 12px;font-weight:600}
.acts button:hover,.note button:hover,.dbar>button:hover:not(:disabled),.tri button:hover{background:rgba(0,113,227,.18)}
.acts button:active,.dbar>button:active,.tri button:active{transform:scale(.96)}
.tri button.go{background:var(--accent);color:#fff}
.tri button.go:hover{background:var(--accent);filter:brightness(1.07)}
.dbar{border-top:0;gap:5px}.dbar>button{padding:6px 9px;white-space:nowrap}.dbar .stats{white-space:nowrap}.dbar .seg button{padding:5px 7px;font-size:12px}
.zoomer{border-radius:14px}
.zoomer button{width:38px;height:36px;color:var(--accent);font-weight:600}
.day .bar{background:var(--accent);border-radius:6px 6px 2px 2px;opacity:.55}
.brow .tr i{background:var(--accent)}
#tip{border-radius:12px;border:0;background:rgba(255,255,255,.92);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
#toast{border-radius:999px;padding:10px 18px}
.key .kt{color:var(--accent)}
.cl circle{stroke-width:2}
@media (min-width:901px){
  #wlDlg{left:50%;right:auto;top:50%;transform:translate(-50%,-50%);width:400px;padding:20px;border-radius:22px;box-shadow:0 0 0 100vmax rgba(20,30,50,.18),var(--shadow)}
  #wlDlg h2{text-align:center;font-size:17px}
}

/* ---- dark smoked-glass appearance ---- */
:root[data-theme="dark"]{
  --bg0:#3b3e46; --bg1:#17181c; --glow:rgba(90,150,255,.16);
  --glass:rgba(78,80,90,.52); --glass-hi:rgba(255,255,255,.16); --glass-brd:rgba(255,255,255,.16);
  --solid:#2b2d33; --ink:#f5f5f7; --muted:#b9bdc6; --line:rgba(255,255,255,.14);
  --land:rgba(255,255,255,.13); --land-line:rgba(255,255,255,.34); --grat:rgba(255,255,255,.07);
  --accent:#6cb6ff; --fill:rgba(255,255,255,.10); --tint:rgba(108,182,255,.18); --switch:#30d158;
  --shadow:0 16px 44px rgba(0,0,0,.42),0 1px 3px rgba(0,0,0,.3);
  --c-incident:#ff7361; --c-vuln:#f2b544; --c-report:#b9a1ff; --c-policy:#52d3ca;
  --c-investment:#72d67f; --c-enforcement:#86b6ff; --c-outage:#bcc4cf;
  --ok:#5bd68a; --warn:#f2b544; --bad:#ff8171;
  color-scheme:dark;
}
[data-theme="dark"] body{background:radial-gradient(900px 600px at 12% 8%,rgba(80,130,230,.30),transparent 70%),radial-gradient(800px 560px at 88% 92%,rgba(150,110,230,.22),transparent 70%),radial-gradient(700px 480px at 70% 20%,rgba(70,170,160,.16),transparent 70%),linear-gradient(165deg,var(--bg0),var(--bg1))}
[data-theme="dark"] .glass{background:linear-gradient(180deg,rgba(255,255,255,.13),rgba(255,255,255,.03)),var(--glass);box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.22),inset 0 -1px 0 rgba(255,255,255,.05)}
[data-theme="dark"] .btn,[data-theme="dark"] .tri button.go{background:#0a6fe0;color:#fff}
[data-theme="dark"] .btn.ghost{background:var(--tint);color:var(--accent)}
[data-theme="dark"] .seg button[aria-pressed="true"],[data-theme="dark"] .tabs button[aria-selected="true"]{background:rgba(255,255,255,.24);color:#fff;box-shadow:0 1px 3px rgba(0,0,0,.35)}
[data-theme="dark"] .seg button:hover:not([aria-pressed="true"]){background:rgba(255,255,255,.10)}
[data-theme="dark"] .chip,[data-theme="dark"] .chip.tog,[data-theme="dark"] .chip.tog[aria-pressed="true"]{background:rgba(255,255,255,.10);box-shadow:none;color:var(--ink)}
[data-theme="dark"] .chip:hover{background:rgba(255,255,255,.17)}
[data-theme="dark"] .chip.tog::before{background:rgba(255,255,255,.22)}
[data-theme="dark"] .chip.tog[aria-pressed="true"]::before{background:var(--switch)}
[data-theme="dark"] .card,[data-theme="dark"] .kpi{background:rgba(255,255,255,.08);box-shadow:none}
[data-theme="dark"] .card:hover,[data-theme="dark"] .card.sel,[data-theme="dark"] #detail .card{background:rgba(255,255,255,.13)}
[data-theme="dark"] .card.sel{box-shadow:0 0 0 2px var(--accent)}
[data-theme="dark"] .todo{background:rgba(108,182,255,.10)}
[data-theme="dark"] .todo.rep{background:rgba(185,161,255,.10)}
[data-theme="dark"] #tip{background:rgba(48,50,57,.94);color:var(--ink)}
[data-theme="dark"] .pill.wl{color:#06203f}
[data-theme="dark"] .acts button:hover,[data-theme="dark"] .note button:hover,[data-theme="dark"] .dbar>button:hover:not(:disabled),[data-theme="dark"] .tri button:hover{background:rgba(108,182,255,.28)}
[data-theme="dark"] .day .bar{opacity:.75}
[data-theme="dark"] .bitems li::before{color:#06203f}
[data-theme="dark"] .zoomer button:hover{background:rgba(255,255,255,.14)}
.pill.rep{color:var(--c-report)}

/* ---- analysis views ---- */
.viz{grid-column:1;grid-row:2;min-height:0;overflow:auto;padding:16px 18px 20px;display:flex;flex-direction:column;gap:18px}
.viz h2{margin:0;font-family:var(--font-display);font-size:17px;font-weight:700;letter-spacing:-.01em}
.viz h3{margin:0 0 2px;font-family:var(--font-display);font-size:14px;font-weight:600}
.viz .q{margin:0 0 8px;font-size:12.5px;color:var(--muted);max-width:86ch}
.viz .cav{margin:6px 0 0;font-size:11.5px;color:var(--muted);max-width:92ch}
.vhead{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.vsec{min-width:0}
.viz svg{display:block;width:100%;height:auto;overflow:visible}
.viz svg text{font-family:var(--font-body);fill:var(--ink)}
.viz .ax{fill:var(--muted);font-size:10.5px}
.viz .lane{fill:var(--fill)}
.viz .wk{fill:var(--line);opacity:.5}
.viz .today{fill:var(--tint)}
.viz .gl{stroke:var(--line);stroke-width:1}
.viz .lbl{font-size:12px;font-weight:600}
.viz .sublbl{font-size:10.5px;fill:var(--muted)}
.viz .ev{cursor:pointer}
.viz .ev:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.viz .ev.dim{opacity:.3}
.viz .selr{fill:none;stroke:var(--ink);stroke-width:2}
.viz .wlr{fill:none;stroke:var(--accent);stroke-width:2}
.viz .base{stroke:var(--muted);stroke-width:1.2;stroke-dasharray:4 3}
.viz .band{fill:var(--muted);opacity:.12}
.viz .due{fill:var(--tint);stroke:var(--accent);stroke-width:1}
.viz .due.over{fill:color-mix(in srgb,var(--bad) 18%,transparent);stroke:var(--bad)}
.viz .now{stroke:var(--bad);stroke-width:1.2;stroke-dasharray:3 3}
.viz .rowhit{fill:transparent;cursor:pointer}
.viz .rowhit:hover{fill:var(--fill)}
.viz .cell{cursor:pointer;stroke:var(--line);stroke-width:1}
.viz .cell.hot{stroke:var(--ink);stroke-width:2}
.viz .cellt{font-size:12px;font-weight:600;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.chains{display:flex;flex-direction:column;gap:10px}
.chain{border-radius:14px;background:var(--fill);padding:10px 12px}
.chain .ch{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-bottom:6px}
.chain .ch b{font-size:13.5px}
.chain .flow{display:flex;flex-wrap:wrap;gap:6px;align-items:stretch}
.chain .step{border:0;text-align:left;border-radius:10px;padding:6px 9px;background:var(--solid);color:var(--ink);font-size:12px;max-width:210px;border-left:4px solid var(--cc);box-shadow:0 1px 2px rgba(20,30,50,.08)}
.chain .step small{display:block;color:var(--muted);font-size:10.5px}
.chain .step:hover{box-shadow:0 0 0 2px var(--accent)}
.chain .arr{display:flex;flex-direction:column;justify-content:center;align-items:center;font-size:10.5px;color:var(--muted);min-width:54px;text-align:center}
.chain .arr i{display:block;width:100%;border-top:2px solid var(--muted);margin:3px 0;position:relative}
.chain .arr i::after{content:"";position:absolute;right:-1px;top:-5px;border:4px solid transparent;border-left-color:var(--muted)}
.chain .arr.inferred i{border-top-style:dashed}.chain .arr.timing i{border-top-style:dotted}
.badge{font-size:10.5px;border-radius:999px;padding:1px 8px;background:var(--tint);color:var(--accent);font-weight:600;white-space:nowrap}
.badge.timing{background:var(--fill);color:var(--muted)}
.vnone{color:var(--muted);font-size:12.5px;padding:8px 0}
@media (max-width:900px){.viz{order:2;overflow:visible}body[data-view="time"] #stage,body[data-view="graph"] #stage{display:none}}

#hoDlg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:560px;max-width:calc(100% - 24px);padding:20px;border-radius:22px;z-index:5;display:flex;flex-direction:column;gap:8px;box-shadow:0 0 0 100vmax rgba(20,30,50,.18),var(--shadow)}
#hoDlg h2{margin:0;font-family:var(--font-display);font-size:17px;font-weight:600;text-align:center}
#hoDlg p{margin:0;font-size:12.5px;color:var(--muted)}
#hoDlg .dacts{display:flex;gap:8px;justify-content:flex-end}
#hoDlg textarea{background:var(--fill);border:0;border-radius:10px;padding:10px 12px;min-height:320px;font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:11.5px;line-height:1.5;color:var(--ink);resize:vertical}
@media (max-width:900px){#hoDlg{position:fixed;left:10px;right:10px;top:60px;width:auto;max-width:none;transform:none}}
#kevBadge:not(:empty){display:inline-block;min-width:17px;padding:0 5px;border-radius:999px;background:var(--bad);color:#fff;font-size:10.5px;font-weight:700;line-height:17px;margin-left:2px}
.khead{font-size:12.5px;color:var(--muted)}
.khead b{color:var(--ink)}
.kcard{border-radius:16px;background:rgba(255,255,255,.8);box-shadow:0 1px 2px rgba(20,30,50,.07);padding:10px 12px;border-left:4px solid var(--c-vuln);display:flex;flex-direction:column;gap:4px}
[data-theme="dark"] .kcard{background:rgba(255,255,255,.08);box-shadow:none}
.kcard.done{opacity:.55}
.kcard .kid{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:11.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.kcard .kt{font-weight:600;font-size:13.5px;line-height:1.3}
.kcard p{margin:0;font-size:12.5px}
.kcard .acts a{border-radius:10px;padding:6px 12px;font-size:12px;font-weight:600;background:var(--tint);color:var(--accent);text-decoration:none}
.pill.due{color:var(--warn)}.pill.over{color:var(--bad)}
.rip{border-radius:14px;background:var(--fill);padding:10px 12px}
.rip .rh{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-bottom:8px}
.rip .rh button{background:transparent;border:0;padding:0;font-weight:600;font-size:13.5px;color:var(--ink);text-align:left}
.rip .rh button:hover{color:var(--accent)}
.rip .cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.rip .col{background:var(--solid);border-radius:10px;padding:8px 10px;font-size:12px;position:relative}
.rip .col h4{margin:0 0 4px;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600}

/* ---------- data store: one static JSON bundle, re-read on a timer ---------- */
var STORE_URL="data/bundle.json",POLL_MS=5*60*1000;
function sendReport(p){
  var b=new URLSearchParams({"form-name":"event-report",event_id:p.event_id,title:p.title,note:p.note,at:p.at,"bot-field":""});
  return fetch("/",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:b.toString()}).then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);});
}
function openStore(){
  var bundle=null,subs=[],last=null;
  function snapDocs(a){return {docs:a.map(function(r){return {id:r.id,data:function(){return r;}};}),size:a.length};}
  function docSnap(v){return {exists:!!v,data:function(){return v;}};}
  function rows(name){var a=bundle&&Array.isArray(bundle[name])?bundle[name]:[];return a.filter(function(r){return r&&typeof r==="object"&&typeof r.id==="string";});}
  function notify(){subs.forEach(function(f){try{f();}catch(x){}});}
  function load(){
    return fetch(STORE_URL+"?t="+Date.now(),{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json();})
      .then(function(j){if(!j||typeof j!=="object"||!Array.isArray(j.events))throw new Error("bad bundle");var changed=j.built_at!==last;bundle=j;last=j.built_at;return changed;});
  }
  function reload(){return load().then(function(ch){if(ch)notify();});}
  function coll(name,filters,order,lim){
    function run(){
      var a=rows(name);
      filters.forEach(function(f){a=a.filter(function(r){var v=r[f[0]];return f[1]===">="?v>=f[2]:f[1]==="<="?v<=f[2]:v===f[2];});});
      if(order)a=a.slice().sort(function(x,y){var p=x[order[0]],q=y[order[0]];return (p<q?-1:p>q?1:0)*(order[1]==="desc"?-1:1);});
      return snapDocs(lim?a.slice(0,lim):a);
    }
    return {where:function(f,o,v){return coll(name,filters.concat([[f,o,v]]),order,lim);},orderBy:function(f,d){return coll(name,filters,[f,d||"asc"],lim);},limit:function(n){return coll(name,filters,order,n);},
      get:function(){return reload().then(run);},
      onSnapshot:function(cb){subs.push(function(){cb(run());});if(bundle)cb(run());return function(){};},
      add:function(payload){return name==="reports"?sendReport(payload):Promise.reject(new Error("read only"));}};
  }
  function doc(path){
    function val(){return bundle&&bundle.docs&&own(bundle.docs,path)?bundle.docs[path]:null;}
    return {get:function(){return reload().then(function(){return docSnap(val());});},
      onSnapshot:function(cb){subs.push(function(){cb(docSnap(val()));});if(bundle)cb(docSnap(val()));return function(){};}};
  }
  setInterval(function(){if(!document.hidden)reload().catch(function(){});},POLL_MS);
  document.addEventListener("visibilitychange",function(){if(!document.hidden)reload().catch(function(){});});
  return load().then(function(){return {collection:function(n){return coll(n,[],null,0);},doc:doc};});
}
openStore().then(function(d){
  if(!d){unavailable=true;render();return;}
  db=d;query=db.collection("events").where("date",">=",ymd(daysAgo(9)));
  var timer=setTimeout(function(){if(!loaded){stale=true;render();}},10000),first=true;
  query.onSnapshot(function(snap){
    var n=apply(snap);
    if(!snap.metadata||!snap.metadata.fromCache){clearTimeout(timer);stale=false;}
    if(first){first=false;var h=location.hash.slice(1);try{h=decodeURIComponent(h);}catch(x){}
      var he=h&&events.find(function(e){return e.id===h;});
      if(he){if(he.status==="claimed"&&!state.claims){state.claims=true;toast("This link points to an unverified claim, so claims are shown for now.");}select(h,true);return;}}
    else if(n)toast(n+" new event"+(n>1?"s":"")+" just arrived.");
    renderSoon();
  },function(){clearTimeout(timer);if(!loaded)unavailable=true;stale=false;render();});
  db.doc("analysis/latest").onSnapshot(function(s){analysis=s.exists?cleanAnalysis(s.data()):null;renderSoon();},function(){});
  try{db.collection("kev").where("added",">=",ymd(daysAgo(45))).onSnapshot(function(snap){kev=snap.docs.map(function(x){return cleanKev(x.id,x.data());}).filter(Boolean);renderKev();if(state.view!=="map")renderSoon();},function(){});}catch(x){}
  db.doc("analysis/ripples").onSnapshot(function(s){ripples=s.exists?cleanRipples(s.data()):null;if(state.view==="graph")renderSoon();},function(){});
  db.doc("brief/latest").onSnapshot(function(s){daily=s.exists?cleanBrief(s.data()):null;renderBrief();},function(){});
  db.doc("stats/history").onSnapshot(function(s){hist=s.exists?cleanHist(s.data()):null;renderInsights(lastList);},function(){});
  try{db.collection("corrections").orderBy("at","desc").limit(20).onSnapshot(function(snap){
    corrections=snap.docs.map(function(x){return cleanCorr(x.data());}).filter(Boolean).slice(0,20);renderInsights(lastList);},function(){});}catch(x){}
  db.doc("meta/status").onSnapshot(function(s){sweep=s.exists?s.data():null;renderStats(lastList);if(state.tab==="ins")renderInsights(lastList);},function(){});
}).catch(function(){unavailable=true;render();});
})();
</script>
